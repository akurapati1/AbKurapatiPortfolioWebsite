# Render.com blueprint: one web service serving site + API. Set the secret env vars in the dashboard.
services:
  - type: web
    name: abhilash-portfolio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - { key: TRUST_PROXY, value: "1" }
      - { key: SMTP_HOST, value: smtp.gmail.com }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: MAIL_TO, value: abhilash.kurapati1301@gmail.com }
      - { key: MAIL_FROM, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: ALLOWED_ORIGINS, value: "https://akurapati1.github.io" }
